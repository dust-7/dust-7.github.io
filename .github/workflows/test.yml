name: Build and test site

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install playwright browsers
      run: npx playwright install chromium --with-deps
    - name: Test build
      run: npm run build
    - name: Run tests
      run: npm test
